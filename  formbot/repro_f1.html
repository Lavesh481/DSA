<!DOCTYPE html>
<html>

<head>
    <title>ML Quiz Reproduction</title>
    <style>
        .geS5ne {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .M7e6Q {
            font-weight: bold;
            font-size: 1.2em;
        }

        .appsMaterialWizToggleLabeledContainer {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="geS5ne">
        <div class="M7e6Q">A binary classifier produced the following counts: True Positives = 70, False Positives = 30,

        <div role="list">
            <div role="listitem">
                <label>
                    <input type="radio" name="q1" value="0.700" role="radio"> 0.700
                </label>
            </div>
            <div role="listitem">
                <label>
                    <input type="radio" name="q1" value="0.778" role="radio"> 0.778
                </label>
            </div>
            <div role="listitem">
                <label>
                    <input type="radio" name="q1" value="0.875" role="radio"> 0.875
                </label>
            </div>
            <div role="listitem">
                <label>
                    <input type="radio" name="q1" value="0.800" role="radio"> 0.800
                </label>
            </div>
        </div>
    </div>
</body>

</html>
